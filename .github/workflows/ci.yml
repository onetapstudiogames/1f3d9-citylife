name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run tests
        if: matrix.os == 'ubuntu-latest'
        run: npm test
        env:
          SKILL_VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUIRE_RELEASE_BASE: "1"
          REQUIRE_LIVE_TRUTH: "1"
      - name: Run follow, terminal, and real vault checks on macOS
        if: matrix.os == 'macos-latest'
        run: node --test test/follow-*.test.mjs test/live-*.test.mjs test/terminal-*.test.mjs test/legacy-console.test.mjs test/vault-roundtrip-macos.test.mjs
      # The Windows leg proves the stubbed win32 backend logic in
      # test/vault-roundtrip-windows.test.mjs, the packaging/content checks,
      # and the setup-windows-abort libuv UV_HANDLE_CLOSING crash class that
      # cannot reproduce on ubuntu-latest. The real Win32 CredWrite/CredRead
      # syscall path is intentionally uncovered: npm test must never exercise
      # CredWrite/CredRead against an operator's Credential Manager. Real
      # syscall coverage, if wanted again, belongs in a separate opt-in test
      # gated on an explicit environment
      # variable such as RUN_REAL_WINDOWS_VAULT=1, off by default. The full
      # suite's identity-command subprocess tests remain on ubuntu-latest;
      # running them on Windows previously cost ~15m30s versus ~11s on Ubuntu
      # because each vault operation launched powershell.exe and paid a fresh
      # Add-Type compilation (see CHANGELOG 1.5.0 / review finding 16).
      - name: "Run tests (Windows: vault, packaging, setup-abort, and follow)"
        if: matrix.os == 'windows-latest'
        run: node scripts/run-tests-with-home-guard.mjs test/vault-roundtrip-windows.test.mjs test/usefulness-and-packaging.test.mjs test/setup-windows-abort.test.mjs test/follow-*.test.mjs test/live-*.test.mjs test/terminal-*.test.mjs test/legacy-console.test.mjs
        env:
          SKILL_VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUIRE_RELEASE_BASE: "1"
          REQUIRE_LIVE_TRUTH: "1"

  # Aggregator: this is the job name branch protection requires ("checks").
  # It must keep publishing that exact context regardless of how the
  # underlying test matrix changes, so renaming or adding matrix legs never
  # silently drops the required status check on main.
  checks:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more matrix legs did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
